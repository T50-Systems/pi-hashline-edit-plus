name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ci-${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-node22
            os: ubuntu-latest
            node: 22
          - id: windows-node22
            os: windows-latest
            node: 22
          - id: macos-node22
            os: macos-latest
            node: 22

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, analyze, release-check, test, and enforce coverage
        run: npm run check
      - name: Upload machine-readable coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.id }}
          path: coverage/coverage-summary.json
      - name: Verify package contents
        run: npm run package:check
      - name: Verify dependency signatures
        run: npm run security:signatures
