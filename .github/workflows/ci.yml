name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ci-${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-node22
            os: ubuntu-latest
            node: 22
          - id: linux-node24
            os: ubuntu-latest
            node: 24
          - id: windows-node22
            os: windows-latest
            node: 22
          - id: macos-node22
            os: macos-latest
            node: 22

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, analyze, release-check, test, and enforce coverage
        run: npm run check
      - name: Upload machine-readable coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.id }}
          path: coverage/coverage-summary.json
      - name: Verify package contents
        run: npm run package:check
      - name: Verify dependency signatures
        run: npm run security:signatures
